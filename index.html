<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>DBD Skill Check</title><style>*{box-sizing:border-box;user-select:none}body{margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}.game-box{display:flex;flex-direction:column;align-items:center;position:relative}.skill-check-container{position:relative;width:300px;height:300px;margin-bottom:10px}canvas{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%}.stats{text-align:center;font-size:1.4rem;margin-bottom:15px;display:flex;gap:25px}.score-val,.combo-val,.best-val,.max-val{font-weight:bold;color:#f33}.combo-val{color:#fc0}.best-val{color:#0fc}.max-val{color:#9bf}.lives-val{color:#ff3366;letter-spacing:2px}.controls{display:flex;flex-direction:column;gap:10px;align-items:center;background:#222;padding:15px;border-radius:15px;border:1px solid #333;margin-top:15px;min-width:320px}.controls-row{display:flex;gap:15px;align-items:center;font-size:.9rem;color:#ccc}.diff-btn{background:#333;color:#aaa;border:1px solid #555;padding:6px 15px;border-radius:5px;cursor:pointer;font-weight:bold}.diff-btn.active{background:#ffcc00;color:#111;box-shadow:0 0 10px #ffcc00}.feedback{position:absolute;font-size:1.5rem;font-weight:bold;text-transform:uppercase;opacity:0;transition:all .3s ease-out;z-index:10}.feedback.show{opacity:1;transform:translateY(-40px)}.great{color:#0fc;text-shadow:0 0 10px #0fc}.good{color:#3f3;text-shadow:0 0 10px #3f3}.miss{color:#f33;text-shadow:0 0 10px #f33}#gameOverModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:100}#gameOverBox{background:#222;padding:40px;border-radius:15px;text-align:center}#restartBtn{padding:12px 30px;background:#ffcc00;color:#111;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin-top:20px}</style></head><body><div id="gameOverModal"><div id="gameOverBox"><h2>GG, ты взорвал гену 💥</h2><p>Очки: <span id="finalScore" style="color:#ffcc00">0</span></p><p>Комбо: <span id="finalCombo" style="color:#ffcc00">0x</span></p><button id="restartBtn">Ещё раз (ПРОБЕЛ)</button></div></div><div class="stats"><div>Очки: <span class="score-val" id="score">0</span></div><div>Комбо: <span class="combo-val" id="combo">0x</span></div><div>Жизни: <span class="lives-val" id="lives">❤️❤️❤️</span></div></div><div class="game-box"><div class="feedback" id="feedback">Great!</div><div class="skill-check-container"><canvas id="gameCanvas" width="300" height="300"></canvas></div><div class="controls"><div class="controls-row">🔊 Волюм: <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5"></div><div class="controls-row">💀 Режим: <button class="diff-btn active" id="btnNormal">Изи</button> <button class="diff-btn" id="btnHard">Жесть</button></div><div class="controls-row" style="flex-direction:column;gap:5px;border-top:1px solid #444;padding-top:8px;width:100%"><div>Рекорд режима: <span class="best-val" id="bestScore">0</span></div><div>Макс комбо: <span class="max-val" id="maxCombo">0x</span></div></div></div></div><script src="script.js"></script></body></html>
