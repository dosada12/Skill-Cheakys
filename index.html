<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBD Skill Check Tetris Hardcore</title><style>*{box-sizing:border-box;user-select:none}body{margin:0;padding:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;transition:background-color .1s ease}.game-box{display:flex;flex-direction:column;align-items:center;position:relative}.skill-check-container{position:relative;width:300px;height:300px;margin-bottom:20px}.shake{animation:shakeAnim .3s ease-in-out}canvas{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%}.stats{text-align:center;font-size:1.2rem;margin-bottom:15px;display:flex;gap:15px;justify-content:center;align-items:center;flex-wrap:wrap}.score-val,.combo-val{font-weight:bold;color:#f33}.combo-val{color:#fc0}.lives-val{color:#ff3366;font-size:1.4rem;letter-spacing:2px}.controls{display:flex;gap:20px;align-items:center;background:#222;padding:8px 20px;border-radius:20px;margin-bottom:20px;border:1px solid #333}.controlslabel{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#ccc}select,input[type=range]{background:#333;color:#fff;border:1px solid #555;border-radius:5px;padding:3px;cursor:pointer}.instructions{color:#888;font-size:.9rem;margin-top:10px;text-align:center}.feedback{position:absolute;font-size:1.5rem;font-weight:bold;text-transform:uppercase;opacity:0;transform:translateY(0);transition:all .3s ease-out;pointer-events:none;z-index:10}.feedback.show{opacity:1;transform:translateY(-40px)}.great{color:#0fc;text-shadow:0 0 10px #0fc}.good{color:#3f3;text-shadow:0 0 10px #3f3}.miss{color:#f33;text-shadow:0 0 10px #f33}@keyframes shakeAnim{0%,100%{transform:translate(0,0)}10%,30%,50%,70%,90%{transform:translate(-6px,-4px)}20%,40%,60%,80%{transform:translate(6px,4px)}}#gameOverModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:100}#gameOverBox{background:#222;padding:40px;border-radius:15px;border:1px solid #444;text-align:center;box-shadow:0 0 20px rgba(255,0,0,0.2)}#gameOverBox h2{color:#f33;margin-top:0;font-size:2rem;text-transform:uppercase}#gameOverBox p{font-size:1.2rem;margin:10px 0}#restartBtn{padding:12px 30px;font-size:1.1rem;background:#ffcc00;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin-top:20px;transition:transform 0.1s}#restartBtn:active{transform:scale(0.95)}</style></head><body><div id="gameOverModal"><div id="gameOverBox"><h2>Игра Окончена</h2><p>Ваш результат: <span id="finalScore" style="font-weight:bold;color:#ffcc00">0</span> очков</p><p>Макс. комбо: <span id="finalCombo" style="font-weight:bold;color:#ffcc00">0x</span></p><button id="restartBtn">Играть заново</button></div></div><div class="stats"><div>Очки: <span class="score-val" id="score">0</span></div><div>Комбо: <span class="combo-val" id="combo">0x</span></div><div>Макс: <span id="max-combo">0</span></div><div>Жизни: <span class="lives-val" id="lives">❤️❤️❤️</span></div></div><div class="controls"><label class="controlslabel">🔊 Громкость:<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5"></label><label class="controlslabel">💀 Сложность:<select id="difficultySelect"><option value="normal">Обычная</option><option value="hard">Тяжелая</option></select></label></div><div class="game-box" id="gameBox"><div class="feedback" id="feedback">Great!</div><div class="skill-check-container"><canvas id="gameCanvas" width="300" height="300"></canvas></div><div class="instructions">Нажми <b>ПРОБЕЛ</b> для попадания!</div></div><script>const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),maxComboEl=document.getElementById('max-combo'),feedbackEl=document.getElementById('feedback'),livesEl=document.getElementById('lives'),gameBox=document.getElementById('gameBox'),gameOverModal=document.getElementById('gameOverModal'),finalScore=document.getElementById('finalScore'),finalCombo=document.getElementById('finalCombo'),restartBtn=document.getElementById('restartBtn'),volumeSlider=document.getElementById('volumeSlider'),difficultySelect=document.getElementById('difficultySelect');let score=0,combo=0,maxCombo=0,lives=3,particles=[],audioCtx=null,bgmStarted=false,isGameOver=false,globalVolume=0.5,currentDir=1,lastDirectionSwitch=0;const center=150,radius=100;let pointerAngle=-0.2,baseSpeed=0.04,currentSpeed=baseSpeed,targetStart=0,targetEnd=0,greatStart=0,greatEnd=0;const notes=,durations=;function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)}if(!bgmStarted){bgmStarted=true;playBGM(0)}}function playBGM(e){if(!audioCtx||isGameOver)return;if(e>=notes.length)e=0;let t=notes[e],o=durations[e]*0.12;if(t>0&&globalVolume>0){let n=audioCtx.createOscillator(),a=audioCtx.createGain();n.type="triangle",n.frequency.setValueAtTime(t,audioCtx.currentTime),a.gain.setValueAtTime(0.08*globalVolume,audioCtx.currentTime),a.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+o),n.connect(a),a.connect(audioCtx.destination),n.start(),n.stop(audioCtx.currentTime+o)}setTimeout(()=>playBGM(e+1),o*1000)}function playSound(e,t,o,n="sine"){if(!audioCtx||globalVolume<=0)return;let a=audioCtx.createOscillator(),i=audioCtx.createGain();a.type=n,a.frequency.setValueAtTime(e,audioCtx.currentTime),i.gain.setValueAtTime(o*globalVolume,audioCtx.currentTime),i.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+t),a.connect(i),i.connect(audioCtx.destination),a.start(),a.stop(audioCtx.currentTime+t)}class Particle{constructor(e,t,o){this.x=e,this.y=t,this.color=o,this.angle=2*Math.random()*Math.PI,this.speed=2*Math.random()+2,this.alpha=1,this.decay=0.02*Math.random()+0.02}update(){this.x+=Math.cos(this.angle)*this.speed,this.y+=Math.sin(this.angle)*this.speed,this.alpha-=this.decay}draw(){ctx.save(),ctx.globalAlpha=this.alpha,ctx.beginPath(),ctx.arc(this.x,this.y,Math.random()*3+1,0,2*Math.PI),ctx.fillStyle=this.color,ctx.shadowBlur=10,ctx.shadowColor=this.color,ctx.fill(),ctx.restore()}}function createSparks(e,t,o){const n=center+Math.cos(e)*radius,a=center+Math.sin(e)*radius;for(let e=0;e<t;e++)particles.push(new Particle(n,a,o))}function triggerMissEffects(){playSound(120,0.4,0.4,"triangle"),document.body.style.backgroundColor='#400',setTimeout(()=>document.body.style.backgroundColor='#111',100),gameBox.classList.add('shake'),setTimeout(()=>gameBox.classList.remove('shake'),300)}function generateNewZone(){const e=difficultySelect.value==="hard",t=Math.max(.4,1-.05*combo),o=(.3*Math.random()+.4)*t,n=.08*t;targetStart=1.2*Math.random()*Math.PI+1.0,targetEnd=targetStart+o;if(e){greatStart=-1;greatEnd=-1;currentDir=Math.random()>0.5?1:-1}else{greatStart=targetStart;greatEnd=targetStart+n;currentDir=1}currentSpeed=baseSpeed*Math.min(2.5,1+.08*combo);lastDirectionSwitch=Date.now()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height),ctx.beginPath(),ctx.arc(center,center,radius,0,2*Math.PI),ctx.strokeStyle='#333',ctx.lineWidth=12,ctx.stroke(),ctx.beginPath(),ctx.arc(center,center,radius,targetStart,targetEnd),ctx.strokeStyle='#ffffff',ctx.lineWidth=12,ctx.stroke(),if(greatStart!==-1){ctx.beginPath(),ctx.arc(center,center,radius,greatStart,greatEnd),ctx.strokeStyle='#ffcc00',ctx.lineWidth=14,ctx.stroke()}ctx.save(),ctx.translate(center,center),ctx.rotate(pointerAngle),ctx.beginPath(),ctx.moveTo(radius-20,0),ctx.lineTo(radius+20,0),ctx.strokeStyle='#ff3333',ctx.lineWidth=4,ctx.stroke(),ctx.restore();for(let e=particles.length-1;e>=0;e--)particles[e].update(),particles[e].alpha<=0?particles.splice(e,1):particles[e].draw()}function showFeedback(e,t){feedbackEl.innerText=e,feedbackEl.className=`feedback ${t} show`,setTimeout(()=>{feedbackEl.classList.remove('show')},400)}function checkSkillCheck(){if(isGameOver)return;initAudio();let e=pointerAngle%(2*Math.PI);if(e<0)e+=2*Math.PI;const t=difficultySelect.value==="hard";if(!t&&e>=greatStart&&e<=greatEnd){combo++;const e=300*combo;score+=e,combo>maxCombo&&(maxCombo=combo),showFeedback(`Отлично! +${e}`,'great'),playSound(880,0.1,0.2),setTimeout(()=>playSound(1200,0.1,0.2),50),createSparks(pointerAngle,30,'#00ffcc'),generateNewZone()}else if(e>=targetStart&&e<=targetEnd){combo+=t?0.5:1;const e=Math.floor(100*combo);score+=e,combo>maxCombo&&(maxCombo=combo),showFeedback(`Хорошо! +${e}`,'good'),playSound(600,0.15,0.2),createSparks(pointerAngle,15,'#33ff33'),generateNewZone()}else{lives--;showFeedback('Промах!','miss');triggerMissEffects();combo=0;if(lives<=0){isGameOver=true;finalScore.innerText=score;finalCombo.innerText=maxCombo;gameOverModal.style.display="flex"}else{generateNewZone()}}updateUI()}function updateUI(){scoreEl.innerText=score,comboEl.innerText=`${combo}x`,maxComboEl.innerText=maxCombo,livesEl.innerText="❤️".repeat(lives)}function update(){if(!isGameOver){pointerAngle+=currentSpeed*currentDir;if(difficultySelect.value==="hard"&&Date.now()-lastDirectionSwitch>1500&&Math.random()<0.005){currentDir*=-1;lastDirectionSwitch=Date.now()}draw()}requestAnimationFrame(update)}volumeSlider.oninput=e=>{globalVolume=parseFloat(e.target.value)};restartBtn.onclick=()=>{isGameOver=false;score=0;combo=0;lives=3;pointerAngle=-0.2;gameOverModal.style.display="none";generateNewZone();updateUI();if(bgmStarted){playBGM(0)}};window.addEventListener('keydown',e=>{"Space"===e.code&&(e.preventDefault(),checkSkillCheck())}),canvas.addEventListener('click',()=>{checkSkillCheck()}),generateNewZone(),updateUI(),update();</script></body></html>
