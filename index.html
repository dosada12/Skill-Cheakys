<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBD Skill Check Infinite Audio</title><style>*{box-sizing:border-box;user-select:none}body{margin:0;padding:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;transition:background-color .1s ease}.game-box{display:flex;flex-direction:column;align-items:center;position:relative}.skill-check-container{position:relative;width:300px;height:300px;margin-bottom:20px}.shake{animation:shakeAnim .3s ease-in-out}canvas{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%}.stats{text-align:center;font-size:1.2rem;margin-bottom:15px}.score-val,.combo-val{font-weight:bold;color:#f33}.combo-val{color:#fc0}.instructions{color:#888;font-size:.9rem;margin-top:10px;text-align:center}.feedback{position:absolute;font-size:1.5rem;font-weight:bold;text-transform:uppercase;opacity:0;transform:translateY(0);transition:all .3s ease-out;pointer-events:none;z-index:10}.feedback.show{opacity:1;transform:translateY(-40px)}.great{color:#0fc;text-shadow:0 0 10px #0fc}.good{color:#3f3;text-shadow:0 0 10px #3f3}.miss{color:#f33;text-shadow:0 0 10px #f33}@keyframes shakeAnim{0%,100%{transform:translate(0,0)}10%,30%,50%,70%,90%{transform:translate(-6px,-4px)}20%,40%,60%,80%{transform:translate(6px,4px)}}</style></head><body><div class="stats">Очки: <span class="score-val" id="score">0</span> | Комбо: <span class="combo-val" id="combo">0x</span> | Макс. Комбо: <span id="max-combo">0</span></div><div class="game-box" id="gameBox"><div class="feedback" id="feedback">Great!</div><div class="skill-check-container"><canvas id="gameCanvas" width="300" height="300"></canvas></div><div class="instructions">Нажми <b>ПРОБЕЛ</b> для попадания!</div></div><script>const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),maxComboEl=document.getElementById('max-combo'),feedbackEl=document.getElementById('feedback'),gameBox=document.getElementById('gameBox');let score=0,combo=0,maxCombo=0,particles=[],audioCtx=null;const center=150,radius=100;let pointerAngle=-0.2,baseSpeed=0.04,currentSpeed=baseSpeed,targetStart=0,targetEnd=0,greatStart=0,greatEnd=0,lastTickAngle=0;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}function playSound(e,t,o,n="sine"){if(!audioCtx)return;let a=audioCtx.createOscillator(),i=audioCtx.createGain();a.type=n,a.frequency.setValueAtTime(e,audioCtx.currentTime),i.gain.setValueAtTime(o,audioCtx.currentTime),i.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+t),a.connect(i),i.connect(audioCtx.destination),a.start(),a.stop(audioCtx.currentTime+t)}class Particle{constructor(e,t,o){this.x=e,this.y=t,this.color=o,this.angle=2*Math.random()*Math.PI,this.speed=2*Math.random()+2,this.alpha=1,this.decay=0.02*Math.random()+0.02}update(){this.x+=Math.cos(this.angle)*this.speed,this.y+=Math.sin(this.angle)*this.speed,this.alpha-=this.decay}draw(){ctx.save(),ctx.globalAlpha=this.alpha,ctx.beginPath(),ctx.arc(this.x,this.y,Math.random()*3+1,0,2*Math.PI),ctx.fillStyle=this.color,ctx.shadowBlur=10,ctx.shadowColor=this.color,ctx.fill(),ctx.restore()}}function createSparks(e,t,o){const n=center+Math.cos(e)*radius,a=center+Math.sin(e)*radius;for(let e=0;e<t;e++)particles.push(new Particle(n,a,o))}function triggerMissEffects(){playSound(120,0.4,0.3,"triangle"),document.body.style.backgroundColor='#400',setTimeout(()=>document.body.style.backgroundColor='#111',100),gameBox.classList.add('shake'),setTimeout(()=>gameBox.classList.remove('shake'),300)}function generateNewZone(e=false){const t=Math.max(.4,1-.05*combo),o=(.3*Math.random()+.4)*t,n=.08*t;targetStart=1.2*Math.random()*Math.PI+1.0,targetEnd=targetStart+o,greatStart=targetStart,greatEnd=targetStart+n,currentSpeed=baseSpeed*Math.min(2.5,1+.08*combo);if(e){pointerAngle=pointerAngle%(2*Math.PI)}else{pointerAngle=-0.2}lastTickAngle=pointerAngle}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height),ctx.beginPath(),ctx.arc(center,center,radius,0,2*Math.PI),ctx.strokeStyle='#333',ctx.lineWidth=12,ctx.stroke(),ctx.beginPath(),ctx.arc(center,center,radius,targetStart,targetEnd),ctx.strokeStyle='#ffffff',ctx.lineWidth=12,ctx.stroke(),ctx.beginPath(),ctx.arc(center,center,radius,greatStart,greatEnd),ctx.strokeStyle='#ffcc00',ctx.lineWidth=14,ctx.stroke(),ctx.save(),ctx.translate(center,center),ctx.rotate(pointerAngle),ctx.beginPath(),ctx.moveTo(radius-20,0),ctx.lineTo(radius+20,0),ctx.strokeStyle='#ff3333',ctx.lineWidth=4,ctx.stroke(),ctx.restore();for(let e=particles.length-1;e>=0;e--)particles[e].update(),particles[e].alpha<=0?particles.splice(e,1):particles[e].draw()}function showFeedback(e,t){feedbackEl.innerText=e,feedbackEl.className=`feedback ${t} show`,setTimeout(()=>{feedbackEl.classList.remove('show')},400)}function checkSkillCheck(){initAudio();const e=pointerAngle%(2*Math.PI);if(e>=greatStart&&e<=greatEnd){combo++;const e=300*combo;score+=e,combo>maxCombo&&(maxCombo=combo),showFeedback(`Отлично! +${e}`,'great'),playSound(880,0.1,0.2),setTimeout(()=>playSound(1200,0.1,0.2),50),createSparks(pointerAngle,30,'#00ffcc'),generateNewZone()}else if(e>=targetStart&&e<=targetEnd){combo++;const e=100*combo;score+=e,combo>maxCombo&&(maxCombo=combo),showFeedback(`Хорошо! +${e}`,'good'),playSound(600,0.15,0.2),createSparks(pointerAngle,15,'#33ff33'),generateNewZone()}else showFeedback('Промах!','miss'),triggerMissEffects(),combo=0,score=0,generateNewZone();updateUI()}function updateUI(){scoreEl.innerText=score,comboEl.innerText=`${combo}x`,maxComboEl.innerText=maxCombo}function update(){pointerAngle+=currentSpeed;if(pointerAngle-lastTickAngle>=0.4){playSound(400,0.02,0.03,"square");lastTickAngle=pointerAngle}if(pointerAngle>2.3*Math.PI){showFeedback('Промах!','miss'),triggerMissEffects(),combo=0,score=0,generateNewZone(true),updateUI()}draw(),requestAnimationFrame(update)}window.addEventListener('keydown',e=>{"Space"===e.code&&(e.preventDefault(),checkSkillCheck())}),canvas.addEventListener('click',()=>{checkSkillCheck()}),generateNewZone(),update();</script></body></html>
