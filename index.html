<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBD Skill Check</title><style>*{box-sizing:border-box;user-select:none}body{margin:0;padding:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}.container{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap}.game-box{display:flex;flex-direction:column;align-items:center;position:relative}.skill-check-container{position:relative;width:300px;height:300px;margin-bottom:20px}canvas{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%}.stats{text-align:center;font-size:1.2rem;margin-bottom:10px}.score-val,.combo-val{font-weight:bold;color:#f33}.combo-val{color:#fc0}.instructions{color:#888;font-size:.9rem;margin-top:10px;text-align:center}.leaderboard{background:#222;padding:20px;border-radius:10px;border:1px solid #333;min-width:250px;max-width:300px}.leaderboard h2{margin-top:0;font-size:1.4rem;text-align:center;color:#fc0;border-bottom:1px solid #444;padding-bottom:10px}.leaderboard ol{padding-left:20px;margin-bottom:0}.leaderboard li{margin:8px 0;font-size:1.1rem}.feedback{position:absolute;font-size:1.5rem;font-weight:bold;text-transform:uppercase;opacity:0;transform:translateY(0);transition:all .3s ease-out;pointer-events:none;z-index:10}.feedback.show{opacity:1;transform:translateY(-40px)}.great{color:#0fc;text-shadow:0 0 10px #0fc}.good{color:#3f3;text-shadow:0 0 10px #3f3}.miss{color:#f33;text-shadow:0 0 10px #f33}</style></head><body><div class="stats">Очки: <span class="score-val" id="score">0</span> | Комбо: <span class="combo-val" id="combo">0x</span> | Макс. Комбо: <span id="max-combo">0</span></div><div class="container"><div class="game-box"><div class="feedback" id="feedback">Great!</div><div class="skill-check-container"><canvas id="gameCanvas" width="300" height="300"></canvas></div><div class="instructions">Нажми <b>ПРОБЕЛ</b> для попадания!</div></div><div class="leaderboard"><h2>Таблица лидеров</h2><ol id="leaderboard-list"></ol></div></div><script>const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),maxComboEl=document.getElementById('max-combo'),feedbackEl=document.getElementById('feedback'),leaderboardList=document.getElementById('leaderboard-list');let score=0,combo=0,maxCombo=0,leaderboard=JSON.parse(localStorage.getItem('dbd_leaderboard'))||[];const center=150,radius=100;let pointerAngle=0,baseSpeed=0.04,currentSpeed=baseSpeed,targetStart=0,targetEnd=0,greatStart=0,greatEnd=0,isRunning=!0;function generateNewZone(){const e=Math.max(.4,1-.05*combo),t=(.3*Math.random()+.4)*e,o=.08*e;targetStart=1.5*Math.random()*Math.PI+.5,targetEnd=targetStart+t,greatStart=targetStart,greatEnd=targetStart+o,pointerAngle=0,currentSpeed=baseSpeed*Math.min(2.2,1+.08*combo)}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height),ctx.beginPath(),ctx.arc(center,center,radius,0,2*Math.PI),ctx.strokeStyle='#333',ctx.lineWidth=12,ctx.stroke(),ctx.beginPath(),ctx.arc(center,center,radius,targetStart,targetEnd),ctx.strokeStyle='#ffffff',ctx.lineWidth=12,ctx.stroke(),ctx.beginPath(),ctx.arc(center,center,radius,greatStart,greatEnd),ctx.strokeStyle='#ffcc00',ctx.lineWidth=14,ctx.stroke(),ctx.save(),ctx.translate(center,center),ctx.rotate(pointerAngle),ctx.beginPath(),ctx.moveTo(radius-20,0),ctx.lineTo(radius+20,0),ctx.strokeStyle='#ff3333',ctx.lineWidth=4,ctx.stroke(),ctx.restore()}function showFeedback(e,t){feedbackEl.innerText=e,feedbackEl.className=`feedback ${t} show`,setTimeout(()=>{feedbackEl.classList.remove('show')},400)}function checkSkillCheck(){const e=pointerAngle%(2*Math.PI);if(e>=greatStart&&e<=greatEnd){combo++;const e=300*combo;score+=e,combo>maxCombo&&(maxCombo=combo),showFeedback(`Отлично! +${e}`,'great'),generateNewZone()}else if(e>=targetStart&&e<=targetEnd){combo++;const e=100*combo;score+=e,combo>maxCombo&&(maxCombo=combo),showFeedback(`Хорошо! +${e}`,'good'),generateNewZone()}else showFeedback('Промах!','miss'),saveScore(),combo=0,generateNewZone();updateUI()}function updateUI(){scoreEl.innerText=score,comboEl.innerText=`${combo}x`,maxComboEl.innerText=maxCombo}function saveScore(){score>0&&(leaderboard.push({score:score,date:new Date().toLocaleDateString()}),leaderboard.sort((e,t)=>t.score-e.score),leaderboard=leaderboard.slice(0,5),localStorage.setItem('dbd_leaderboard',JSON.stringify(leaderboard)),renderLeaderboard()),score=0}function renderLeaderboard(){leaderboardList.innerHTML='',0===leaderboard.length?leaderboardList.innerHTML='<li>Нет рекордов</li>':leaderboard.forEach(e=>{leaderboardList.innerHTML+=`<li>${e.score} очков <small style="color:#666">(${e.date})</small></li>`})}function update(){isRunning&&(pointerAngle+=currentSpeed,pointerAngle>2*Math.PI&&(showFeedback('Промах!','miss'),saveScore(),combo=0,generateNewZone(),updateUI()),draw()),requestAnimationFrame(update)}window.addEventListener('keydown',e=>{"Space"===e.code&&(e.preventDefault(),checkSkillCheck())}),canvas.addEventListener('click',()=>{checkSkillCheck()}),generateNewZone(),renderLeaderboard(),update();</script></body></html>
