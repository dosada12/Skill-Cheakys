<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DBD Skill Check</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 30px; user-select: none; }
        .stats { font-size: 1.2rem; margin-bottom: 20px; }
        .skill-box { position: relative; width: 300px; height: 300px; margin: 0 auto 20px; }
        canvas { position: absolute; top: 0; left: 0; }
        .controls { background: #222; padding: 15px; border-radius: 10px; display: inline-block; margin-top: 20px; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; margin: 5px; cursor: pointer; font-weight: bold; }
        .btn.active { background: #fc0; color: #111; }
        #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="menu">
        <h2>Игра Окончена</h2>
        <p>Очки: <span id="fScore" style="color:#fc0">0</span> | Комбо: <span id="fCombo" style="color:#fc0">0x</span></p>
        <button class="btn" id="restBtn">Играть заново (ПРОБЕЛ)</button>
    </div>

    <div class="stats">
        Очки: <span id="score" style="color:#f33; font-weight:bold;">0</span> | 
        Комбо: <span id="combo" style="color:#fc0; font-weight:bold;">0x</span> | 
        Жизни: <span id="lives" style="color:#f33;">❤️❤️❤️</span>
    </div>

    <div class="skill-box">
        <canvas id="cvs" width="300" height="300"></canvas>
    </div>
    <div>Нажми <b>ПРОБЕЛ</b> для попадания!</div>

    <div class="controls">
        🔊 Громкость: <input type="range" id="vol" min="0" max="1" step="0.1" value="0.5"><br><br>
        💀 Сложность: 
        <button class="btn active" id="bNorm">Обычная</button>
        <button class="btn" id="bHard">Тяжелая</button>
        <div style="margin-top: 10px; font-size: 0.9rem; color: #aaa;">
            Рекорд режима: <span id="best" style="color:#0fc">0</span> | 
            Макс комбо: <span id="maxC" style="color:#9bf">0x</span>
        </div>
    </div>

    <script>
        const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
        const scoreEl = document.getElementById('score'), comboEl = document.getElementById('combo'), livesEl = document.getElementById('lives');
        const menu = document.getElementById('menu'), fScore = document.getElementById('fScore'), fCombo = document.getElementById('fCombo'), restBtn = document.getElementById('restBtn');
        const vol = document.getElementById('vol'), bNorm = document.getElementById('bNorm'), bHard = document.getElementById('bHard'), bestEl = document.getElementById('best'), maxCEl = document.getElementById('maxC');

        let score = 0, combo = 0, lives = 3, isOver = false, diff = "normal", dir = 1, lastSwitch = 0, aCtx = null;
        let hNormal = parseInt(localStorage.getItem('hN')) || 0, cNormal = parseInt(localStorage.getItem('cN')) || 0;
        let hHard = parseInt(localStorage.getItem('hH')) || 0, cHard = parseInt(localStorage.getItem('cH')) || 0;
        let maxSessionCombo = 0;

        let angle = -0.2, speed = 0.04, tStart = 0, tEnd = 0, gStart = 0, gEnd = 0;

        function snd(f, d, v, t = "sine") {
            if (!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (vol.value <= 0) return;
            let o = aCtx.createOscillator(), g = aCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, aCtx.currentTime);
            g.gain.setValueAtTime(f === 120 ? v * vol.value : v * vol.value * 0.3, aCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, aCtx.currentTime + d);
            o.connect(g); g.connect(aCtx.destination);
            o.start(); o.stop(aCtx.currentTime + d);
        }

        function newZone() {
            let scale = Math.max(0.4, 1 - 0.05 * combo);
            tStart = Math.random() * Math.PI * 1.2 + 1.0;
            tEnd = tStart + (Math.random() * 0.3 + 0.4) * scale;
            if (diff === "hard") { gStart = -1; gEnd = -1; dir = Math.random() > 0.5 ? 1 : -1; } 
            else { gStart = tStart; gEnd = tStart + 0.08 * scale; dir = 1; }
            speed = 0.04 * Math.min(2.5, 1 + 0.08 * combo);
            lastSwitch = Date.now();
        }

        function draw() {
            ctx.clearRect(0, 0, 300, 300);
            ctx.lineWidth = 12;
            ctx.beginPath(); ctx.arc(150, 150, 100, 0, Math.PI * 2); ctx.strokeStyle = '#333'; ctx.stroke();
            ctx.beginPath(); ctx.arc(150, 150, 100, tStart, tEnd); ctx.strokeStyle = '#fff'; ctx.stroke();
            if (gStart !== -1) { ctx.beginPath(); ctx.arc(150, 150, 100, gStart, gEnd); ctx.strokeStyle = '#fc0'; ctx.stroke(); }
            ctx.save(); ctx.translate(150, 150); ctx.rotate(angle); ctx.lineWidth = 4; ctx.strokeStyle = '#f33';
            ctx.beginPath(); ctx.moveTo(80, 0); ctx.lineTo(120, 0); ctx.stroke(); ctx.restore();
        }

        function check() {
            if (isOver) return;
            let a = angle % (Math.PI * 2); if (a < 0) a += Math.PI * 2;
            if (diff !== "hard" && a >= gStart && a <= gEnd) {
                combo++; score += 300 * combo; if (combo > maxSessionCombo) maxSessionCombo = combo;
                snd(880, 0.1, 0.2); newZone();
            } else if (a >= tStart && a <= tEnd) {
                combo += diff === "hard" ? 0.5 : 1; score += Math.floor(100 * combo); if (combo > maxSessionCombo) maxSessionCombo = combo;
                snd(600, 0.15, 0.2); newZone();
            } else {
                lives--; snd(120, 0.4, 0.4, "triangle"); combo = 0;
                if (lives <= 0) {
                    isOver = true; fScore.innerText = score; fCombo.innerText = maxSessionCombo + "x";
                    if (diff === "normal") {
                        if (score > hNormal) { hNormal = score; localStorage.setItem('hN', hNormal); }
                        if (maxSessionCombo > cNormal) { cNormal = maxSessionCombo; localStorage.setItem('cN', cNormal); }
                    } else {
                        if (score > hHard) { hHard = score; localStorage.setItem('hH', hHard); }
                        if (maxSessionCombo > cHard) { cHard = maxSessionCombo; localStorage.setItem('cH', cHard); }
                    }
                    menu.style.display = "flex";
                } else { newZone(); }
            }
            ui();
        }

        function ui() {
            scoreEl.innerText = score; comboEl.innerText = combo + "x"; livesEl.innerText = "❤️".repeat(lives);
            if (diff === "normal") { bestEl.innerText = hNormal; maxCEl.innerText = cNormal + "x"; } 
            else { bestEl.innerText = hHard; maxCEl.innerText = cHard + "x"; }
        }

        function loop() {
            if (!isOver) {
                angle += speed * dir;
                if (diff === "hard" && Date.now() - lastSwitch > 1500 && Math.random() < 0.005) { dir *= -1; lastSwitch = Date.now(); }
                draw();
            }
            requestAnimationFrame(loop);
        }

        function restart() { isOver = false; score = 0; combo = 0; maxSessionCombo = 0; lives = 3; angle = -0.2; menu.style.display = "none"; newZone(); ui(); }

        bNorm.onclick = () => { if (isOver) return; diff = "normal"; bNorm.classList.add("active"); bHard.classList.remove("active"); newZone(); ui(); };
        bHard.onclick = () => { if (isOver) return; diff = "hard"; bHard.classList.add("active"); bNorm.classList.remove("active"); newZone(); ui(); };
        restBtn.onclick = restart;
        window.addEventListener('keydown', e => { if (e.code === "Space") { e.preventDefault(); if (isOver) restart(); else check(); } });
        cvs.addEventListener('click', () => { if (isOver) restart(); else check(); });

        newZone(); ui(); loop();
    </script>
</body>
</html>
