<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBD Skill Check Tetris Ultimate</title><style>*{box-sizing:border-box;user-select:none}body{margin:0;padding:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;transition:background-color .1s ease}.game-box{display:flex;flex-direction:column;align-items:center;position:relative;margin-bottom:10px}.skill-check-container{position:relative;width:300px;height:300px;margin-bottom:10px}.shake{animation:shakeAnim .3s ease-in-out}canvas{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%}.stats{text-align:center;font-size:1.4rem;margin-bottom:15px;display:flex;gap:25px;justify-content:center;align-items:center;flex-wrap:wrap}.score-val,.combo-val,.best-val,.max-val{font-weight:bold;color:#f33}.combo-val{color:#fc0}.best-val{color:#0fc}.max-val{color:#9bf}.lives-val{color:#ff3366;font-size:1.5rem;letter-spacing:2px}.controls{display:flex;flex-direction:column;gap:10px;align-items:center;background:#222;padding:15px 25px;border-radius:15px;border:1px solid #333;margin-top:15px;min-width:320px}.controls-row{display:flex;gap:15px;align-items:center;font-size:.9rem;color:#ccc;justify-content:center;width:100%}.records-row{border-top:1px solid #444;padding-top:8px;margin-top:5px;flex-direction:column;gap:5px}.diff-btn{background:#333;color:#aaa;border:1px solid #555;padding:6px 15px;border-radius:5px;cursor:pointer;font-weight:bold;transition:all .2s}.diff-btn.active{background:#ffcc00;color:#111;border-color:#ffcc00;box-shadow:0 0 10px #ffcc00}input[type=range]{background:#333;color:#fff;border:1px solid #555;border-radius:5px;padding:3px;cursor:pointer}.instructions{color:#888;font-size:.9rem;margin-top:5px;text-align:center}.feedback{position:absolute;font-size:1.5rem;font-weight:bold;text-transform:uppercase;opacity:0;transform:translateY(0);transition:all .3s ease-out;pointer-events:none;z-index:10}.feedback.show{opacity:1;transform:translateY(-40px)}.great{color:#0fc;text-shadow:0 0 10px #0fc}.good{color:#3f3;text-shadow:0 0 10px #3f3}.miss{color:#f33;text-shadow:0 0 10px #f33}@keyframes shakeAnim{0%,100%{transform:translate(0,0)}10%,30%,50%,70%,90%{transform:translate(-6px,-4px)}20%,40%,60%,80%{transform:translate(6px,4px)}}#gameOverModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:100}#gameOverBox{background:#222;padding:40px;border-radius:15px;border:1px solid #444;text-align:center;box-shadow:0 0 20px rgba(255,0,0,0.2)}#gameOverBox h2{color:#f33;margin-top:0;font-size:2rem;text-transform:uppercase}#gameOverBox p{font-size:1.2rem;margin:10px 0}#restartBtn{padding:12px 30px;font-size:1.1rem;background:#ffcc00;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin-top:20px;transition:transform 0.1s}#restartBtn:active{transform:scale(0.95)}</style></head><body><div id="gameOverModal"><div id="gameOverBox"><h2>Игра Окончена</h2><p>Ваш результат: <span id="finalScore" style="font-weight:bold;color:#ffcc00">0</span> очков</p><p>Макс. комбо: <span id="finalCombo" style="font-weight:bold;color:#ffcc00">0x</span></p><button id="restartBtn">Играть заново (ПРОБЕЛ)</button></div></div><div class="stats"><div>Очки: <span class="score-val" id="score">0</span></div><div>Комбо: <span class="combo-val" id="combo">0x</span></div><div>Жизни: <span class="lives-val" id="lives">❤️❤️❤️</span></div></div><div class="game-box" id="gameBox"><div class="feedback" id="feedback">Great!</div><div class="skill-check-container"><canvas id="gameCanvas" width="300" height="300"></canvas></div><div class="instructions">Нажми <b>ПРОБЕЛ</b> для попадания!</div><div class="controls"><div class="controls-row">🔊 Громкость: <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5"></div><div class="controls-row">💀 Сложность: <button class="diff-btn active" id="btnNormal">Обычная</button> <button class="diff-btn" id="btnHard">Тяжелая</button></div><div class="controls-row records-row"><div>Рекорд режима: <span class="best-val" id="bestScore">0</span></div><div>Макс. комбо режима: <span class="max-val" id="maxCombo">0x</span></div></div></div></div><script src="script.js"></script></body></html>
